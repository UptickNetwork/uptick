version: "2"
run:
  tests: false
linters:
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - dupl
    - goconst
    - gocritic
    - gomodguard
    - gosec
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
  settings:
    dogsled:
      max-blank-identifiers: 3
    # gosec G115 (integer overflow conversion): nearly every finding is in
    # SDK-forked boilerplate or legacy upgrade code with provably bounded
    # ranges. Auditing/rewriting them is tracked separately; silencing the
    # whole class here so the gate stays usable. Real gosec classes (G306,
    # G118, ...) remain enabled — see the two fixed in this repo.
    gosec:
      excludes:
        - G115
    # SA1019 (use of deprecated): flags upstream Cosmos SDK / cosmos-evm
    # deprecations we inherit from the fork. Upgrading those APIs is a
    # dependency-bump task, not a release-branch patch.
    staticcheck:
      # golangci's default set minus SA1019 (see below) and QF1008: keep the
      # ST* style checks off (never enabled in the v1 era either). QF1008
      # ("could remove embedded field") would churn upgrade-critical code
      # where the explicit embedded selector (app.BaseApp.X,
      # legacyAccount.BaseAccount.X) is deliberately clearer.
      checks:
        - all
        - -SA1019
        - -QF1008
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    # govet "inline" produces toolchain-mismatch noise: the published
    # golangci-lint binary is built with a newer Go than go.mod targets
    # ("cannot inline call to ioutil.ReadFile (declared using go1.27.0) into
    # a file using go1.25.13"). Not a property of our code.
    govet:
      disable:
        - inline
    gomodguard:
      blocked:
        versions:
          - https://github.com/etcd-io/etcd:
              version: '>= 3.4.10 || ~3.3.23'
              reason: CVE-2020-15114; CVE-2020-15136; CVE-2020-15115
          - https://github.com/dgrijalva/jwt-go:
              version: '>= 4.0.0-preview1'
              reason: CVE-2020-26160
    misspell:
      locale: US
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - lll
        source: https://
      # revive var-naming / unused-parameter fire ~190 times across the
      # Cosmos-SDK-forked boilerplate (init.go, genaccounts.go, msg types).
      # Renaming forked structs/fields breaks proto/json wiring for zero
      # behaviour gain; unused parameters are mandated by interface
      # signatures. Everything else revive checks stays enforced.
      - linters:
          - revive
        text: "^(var-naming|unused-parameter):"
      # internft.InterNftKeeper: renaming the type touches 16 ICS721 wiring
      # sites right before a release; tracked for the next minor.
      - linters:
          - revive
        text: "type name will be used as internft.InterNftKeeper"
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 50
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
