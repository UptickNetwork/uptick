version: "2"
run:
  tests: false
  # Default is 1m: the 2-core GitHub runner needs >1m of wall time for this
  # codebase (locally ~24s on an M-series Mac with ~146s of CPU time), so the
  # gate died with "Timeout exceeded" on every CI run.
  timeout: 10m
linters:
  enable:
    - asciicheck
    - bodyclose
    - dogsled
    - dupl
    - goconst
    - gocritic
    - gomodguard
    - gosec
    - misspell
    - nakedret
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unparam
  settings:
    dogsled:
      max-blank-identifiers: 3
    # gosec G115 (integer overflow conversion): nearly every finding is in
    # SDK-forked boilerplate or legacy upgrade code with provably bounded
    # ranges. Auditing/rewriting them is tracked separately; silencing the
    # whole class here so the gate stays usable. Real gosec classes (G306,
    # G118, ...) remain enabled — see the two fixed in this repo.
    gosec:
      excludes:
        - G115
    # SA1019 (use of deprecated): flags upstream Cosmos SDK / cosmos-evm
    # deprecations we inherit from the fork. Upgrading those APIs is a
    # dependency-bump task, not a release-branch patch.
    staticcheck:
      # golangci's default set minus SA1019 (see below) and QF1008: keep the
      # ST* style checks off (never enabled in the v1 era either). QF1008
      # ("could remove embedded field") would churn upgrade-critical code
      # where the explicit embedded selector (app.BaseApp.X,
      # legacyAccount.BaseAccount.X) is deliberately clearer.
      checks:
        - all
        - -SA1019
        - -QF1008
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
    # govet "inline" produces toolchain-mismatch noise: the published
    # golangci-lint binary is built with a newer Go than go.mod targets
    # ("cannot inline call to ioutil.ReadFile (declared using go1.27.0) into
    # a file using go1.25.13"). Not a property of our code.
    govet:
      disable:
        - inline
    gomodguard:
      blocked:
        versions:
          - https://github.com/etcd-io/etcd:
              version: '>= 3.4.10 || ~3.3.23'
              reason: CVE-2020-15114; CVE-2020-15136; CVE-2020-15115
          - https://github.com/dgrijalva/jwt-go:
              version: '>= 4.0.0-preview1'
              reason: CVE-2020-26160
    misspell:
      locale: US
    nolintlint:
      require-explanation: false
      require-specific: false
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - gosec
        path: _test\.go
      - linters:
          - lll
        source: https://
      # revive var-naming / unused-parameter fire ~190 times across the
      # Cosmos-SDK-forked boilerplate (init.go, genaccounts.go, msg types).
      # Renaming forked structs/fields breaks proto/json wiring for zero
      # behaviour gain; unused parameters are mandated by interface
      # signatures. Everything else revive checks stays enforced.
      - linters:
          - revive
        text: "^(var-naming|unused-parameter):"
      # internft.InterNftKeeper: renaming the type touches 16 ICS721 wiring
      # sites right before a release; tracked for the next minor.
      - linters:
          - revive
        text: "type name will be used as internft.InterNftKeeper"
      # app/upgrades/v040/** is the FROZEN v0.4.0 handler. 3424c91
      # "revert(upgrades): freeze the v0.4.0 handler at the released v0.4.1
      # build" restored it from tag v0.4.1 (81bf79e) because the v0.4.0 plan had
      # already executed on the testnet and this handler is release-critical.
      #
      # Since then the tree accepts exactly ONE kind of edit: a genuine defect
      # fix named fix(v040): -- e.g. 1c51378 "fix(v040): reject malformed legacy
      # proposal protos instead of panicking", which hardened the hand-rolled
      # legacy proto decoders. Style churn is not acceptable here even when it
      # is behaviour-preserving: the freeze's whole value is that the diff
      # against the testnet-validated build stays bounded and reviewable, and
      # every cosmetic hunk spends that budget for nothing.
      #
      # So these findings cannot be fixed in place -- narrowing a signature
      # (unparam), de-duplicating the two legacy Unmarshal decoders (dupl), or
      # dropping a redundant int() / realigning a block (unconvert, gofmt) is a
      # source edit, i.e. exactly the class 3424c91 reverted. Excluded by
      # configuration instead; lint is not what verifies the freeze.
      #
      # The reference is the tree AS IT STANDS, not tag v0.4.1: 1c51378
      # legitimately moved it past that tag. Do NOT "restore" this tree to the
      # tag -- that would delete 1c51378's panic hardening and reintroduce an
      # out-of-range slice on malformed legacy proposal bytes.
      #
      # To change this pattern, land it in the v0.4.1 handler
      # (app/upgrades/v041/**) -- v0.4.0 is history.
      - linters:
          - dupl
          - unconvert
          - unparam
        path: ^app/upgrades/v040/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-same-issues: 50
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # Frozen tree: see the app/upgrades/v040/** note under
      # linters.exclusions.rules. gofmt's only finding there is an alignment-only
      # realign of the compile-time assertion block -- a source edit the freeze
      # still forbids, so it is excluded rather than applied.
      - ^app/upgrades/v040/
