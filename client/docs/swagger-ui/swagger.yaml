        description: pagination defines the pagination in the response.
    description: QueryVotesResponse is the response type for the Query/Votes RPC method.
  cosmos.gov.v1.TallyParams:
    type: object
    properties:
      quorum:
        type: string
        description: 'Minimum percentage of total stake needed to vote for a result to be

          considered valid.'
      threshold:
        type: string
        description: 'Minimum proportion of Yes votes for proposal to pass. Default value: 0.5.'
      veto_threshold:
        type: string
        description: 'Minimum value of Veto votes to Total votes ratio for proposal to be

          vetoed. Default value: 1/3.'
    description: TallyParams defines the params for tallying votes on governance proposals.
  cosmos.gov.v1.TallyResult:
    type: object
    properties:
      yes_count:
        type: string
        description: yes_count is the number of yes votes on a proposal.
      abstain_count:
        type: string
        description: abstain_count is the number of abstain votes on a proposal.
      no_count:
        type: string
        description: no_count is the number of no votes on a proposal.
      no_with_veto_count:
        type: string
        description: no_with_veto_count is the number of no with veto votes on a proposal.
    description: TallyResult defines a standard tally for a governance proposal.
  cosmos.gov.v1.Vote:
    type: object
    properties:
      proposal_id:
        type: string
        format: uint64
        description: proposal_id defines the unique id of the proposal.
      voter:
        type: string
        description: voter is the voter address of the proposal.
      options:
        type: array
        items:
          $ref: '#/definitions/cosmos.gov.v1.WeightedVoteOption'
        description: options is the weighted vote options.
      metadata:
        type: string
        title: 'metadata is any arbitrary metadata attached to the vote.

          the recommended format of the metadata is to be found here: https://docs.cosmos.network/v0.47/modules/gov#vote-5'
    description: 'Vote defines a vote on a governance proposal.

      A Vote consists of a proposal ID, the voter, and the vote option.'
  cosmos.gov.v1.VoteOption:
    type: string
    enum:
    - VOTE_OPTION_UNSPECIFIED
    - VOTE_OPTION_YES
    - VOTE_OPTION_ABSTAIN
    - VOTE_OPTION_NO
    - VOTE_OPTION_NO_WITH_VETO
    default: VOTE_OPTION_UNSPECIFIED
    description: "VoteOption enumerates the valid vote options for a given governance proposal.\n\n - VOTE_OPTION_UNSPECIFIED:\
      \ VOTE_OPTION_UNSPECIFIED defines a no-op vote option.\n - VOTE_OPTION_YES: VOTE_OPTION_YES defines a yes vote option.\n\
      \ - VOTE_OPTION_ABSTAIN: VOTE_OPTION_ABSTAIN defines an abstain vote option.\n - VOTE_OPTION_NO: VOTE_OPTION_NO defines\
      \ a no vote option.\n - VOTE_OPTION_NO_WITH_VETO: VOTE_OPTION_NO_WITH_VETO defines a no with veto vote option."
  cosmos.gov.v1.VotingParams:
    type: object
    properties:
      voting_period:
        type: string
        description: Duration of the voting period.
    description: VotingParams defines the params for voting on governance proposals.
  cosmos.gov.v1.WeightedVoteOption:
    type: object
    properties:
      option:
        $ref: '#/definitions/cosmos.gov.v1.VoteOption'
        description: option defines the valid vote options, it must not contain duplicate vote options.
      weight:
        type: string
        description: weight is the vote weight associated with the vote option.
    description: WeightedVoteOption defines a unit of vote for vote split.
  cosmos.staking.v1beta1.BondStatus:
    type: string
    enum:
    - BOND_STATUS_UNSPECIFIED
    - BOND_STATUS_UNBONDED
    - BOND_STATUS_UNBONDING
    - BOND_STATUS_BONDED
    default: BOND_STATUS_UNSPECIFIED
    description: "BondStatus is the status of a validator.\n\n - BOND_STATUS_UNSPECIFIED: UNSPECIFIED defines an invalid validator\
      \ status.\n - BOND_STATUS_UNBONDED: UNBONDED defines a validator that is not bonded.\n - BOND_STATUS_UNBONDING: UNBONDING\
      \ defines a validator that is unbonding.\n - BOND_STATUS_BONDED: BONDED defines a validator that is bonded."
  cosmos.staking.v1beta1.Commission:
    type: object
    properties:
      commission_rates:
        $ref: '#/definitions/cosmos.staking.v1beta1.CommissionRates'
        description: commission_rates defines the initial commission rates to be used for creating a validator.
      update_time:
        type: string
        format: date-time
        description: update_time is the last time the commission rate was changed.
    description: Commission defines commission parameters for a given validator.
  cosmos.staking.v1beta1.CommissionRates:
    type: object
    properties:
      rate:
        type: string
        description: rate is the commission rate charged to delegators, as a fraction.
      max_rate:
        type: string
        description: max_rate defines the maximum commission rate which validator can ever charge, as a fraction.
      max_change_rate:
        type: string
        description: max_change_rate defines the maximum daily increase of the validator commission, as a fraction.
    description: 'CommissionRates defines the initial commission rates to be used for creating

      a validator.'
  cosmos.staking.v1beta1.Delegation:
    type: object
    properties:
      delegator_address:
        type: string
        description: delegator_address is the encoded address of the delegator.
      validator_address:
        type: string
        description: validator_address is the encoded address of the validator.
      shares:
        type: string
        description: shares define the delegation shares received.
    description: 'Delegation represents the bond with tokens held by an account. It is

      owned by one delegator, and is associated with the voting power of one

      validator.'
  cosmos.staking.v1beta1.DelegationResponse:
    type: object
    properties:
      delegation:
        $ref: '#/definitions/cosmos.staking.v1beta1.Delegation'
      balance:
        $ref: '#/definitions/cosmos.base.v1beta1.Coin'
    description: 'DelegationResponse is equivalent to Delegation except that it contains a

      balance in addition to shares which is more suitable for client responses.'
  cosmos.staking.v1beta1.Description:
    type: object
    properties:
      moniker:
        type: string
        description: moniker defines a human-readable name for the validator.
      identity:
        type: string
        description: identity defines an optional identity signature (ex. UPort or Keybase).
      website:
        type: string
        description: website defines an optional website link.
      security_contact:
        type: string
        description: security_contact defines an optional email for security contact.
      details:
        type: string
        description: details define other optional details.
    description: Description defines a validator description.
  cosmos.staking.v1beta1.HistoricalInfo:
    type: object
    properties:
      header:
        $ref: '#/definitions/tendermint.types.Header'
      valset:
        type: array
        items:
          $ref: '#/definitions/cosmos.staking.v1beta1.Validator'
    description: 'HistoricalInfo contains header and validator information for a given block.

      It is stored as part of staking module''s state, which persists the `n` most

      recent HistoricalInfo

      (`n` is set by the staking module''s `historical_entries` parameter).'
  cosmos.staking.v1beta1.Params:
    type: object
    properties:
      unbonding_time:
        type: string
        description: unbonding_time is the time duration of unbonding.
      max_validators:
        type: integer
        format: int64
        description: max_validators is the maximum number of validators.
      max_entries:
        type: integer
        format: int64
        description: max_entries is the max entries for either unbonding delegation or redelegation (per pair/trio).
      historical_entries:
        type: integer
        format: int64
        description: historical_entries is the number of historical entries to persist.
      bond_denom:
        type: string
        description: bond_denom defines the bondable coin denomination.
      min_commission_rate:
        type: string
        title: min_commission_rate is the chain-wide minimum commission rate that a validator can charge their delegators
    description: Params defines the parameters for the x/staking module.
  cosmos.staking.v1beta1.Pool:
    type: object
    properties:
      not_bonded_tokens:
        type: string
      bonded_tokens:
        type: string
    description: 'Pool is used for tracking bonded and not-bonded token supply of the bond

      denomination.'
  cosmos.staking.v1beta1.QueryDelegationResponse:
