swagger: '2.0'
info:
  title: Uptick Chain - REST and gRPC Gateway docs
  description: A REST interface for state queries and transactions exposed by the gRPC gateway
  version: v0.4.0
paths:
  /cosmos/evm/vm/v1/account/{address}:
    get:
      summary: Account queries an Ethereum account.
      operationId: EvmAccount
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.QueryAccountResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      parameters:
      - name: address
        description: address is the ethereum hex address to query the account for.
        in: path
        required: true
        type: string
      tags:
      - Query
  /cosmos/evm/vm/v1/balances/{address}:
    get:
      summary: 'Balance queries the balance of a the EVM denomination for a single

        account.'
      operationId: Balance
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.QueryBalanceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      parameters:
      - name: address
        description: address is the ethereum hex address to query the balance for.
        in: path
        required: true
        type: string
      tags:
      - Query
  /cosmos/evm/vm/v1/base_fee:
    get:
      summary: 'BaseFee queries the base fee of the parent block of the current block,

        it''s similar to feemarket module''s method, but also checks london hardfork

        status.'
      operationId: BaseFee
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.QueryBaseFeeResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      tags:
      - Query
  /cosmos/evm/vm/v1/codes/{address}:
    get:
      summary: Code queries the balance of all coins for a single account.
      operationId: Code
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.QueryCodeResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      parameters:
      - name: address
        description: address is the ethereum hex address to query the code for.
        in: path
        required: true
        type: string
      tags:
      - Query
  /cosmos/evm/vm/v1/config:
    get:
      summary: Config queries the EVM configuration
      operationId: Config
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.QueryConfigResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      tags:
      - Query
  /cosmos/evm/vm/v1/cosmos_account/{address}:
    get:
      summary: CosmosAccount queries an Ethereum account's Cosmos Address.
      operationId: EvmCosmosAccount
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.QueryCosmosAccountResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      parameters:
      - name: address
        description: address is the ethereum hex address to query the account for.
        in: path
        required: true
        type: string
      tags:
      - Query
  /cosmos/evm/vm/v1/estimate_gas:
    get:
      summary: EstimateGas implements the `eth_estimateGas` rpc api
      operationId: EstimateGas
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.EstimateGasResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      parameters:
      - name: args
        description: args uses the same json format as the json rpc api.
        in: query
        required: false
        type: string
        format: byte
      - name: gas_cap
        description: gas_cap defines the default gas cap to be used.
        in: query
        required: false
        type: string
        format: uint64
      - name: proposer_address
        description: proposer_address of the requested block in hex format.
        in: query
        required: false
        type: string
        format: byte
      - name: chain_id
        description: chain_id is the eip155 chain id parsed from the requested block header.
        in: query
        required: false
        type: string
        format: int64
      - name: overrides
        description: state overrides encoded as json.
        in: query
        required: false
        type: string
        format: byte
      tags:
      - Query
  /cosmos/evm/vm/v1/eth_call:
    get:
      summary: EthCall implements the `eth_call` rpc api
      operationId: EthCall
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.MsgEthereumTxResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      parameters:
      - name: args
        description: args uses the same json format as the json rpc api.
        in: query
        required: false
        type: string
        format: byte
      - name: gas_cap
        description: gas_cap defines the default gas cap to be used.
        in: query
        required: false
        type: string
        format: uint64
      - name: proposer_address
        description: proposer_address of the requested block in hex format.
        in: query
        required: false
        type: string
        format: byte
      - name: chain_id
        description: chain_id is the eip155 chain id parsed from the requested block header.
        in: query
        required: false
        type: string
        format: int64
      - name: overrides
        description: state overrides encoded as json.
        in: query
        required: false
        type: string
        format: byte
      tags:
      - Query
  /cosmos/evm/vm/v1/min_gas_price:
    get:
      summary: 'GlobalMinGasPrice queries the MinGasPrice

        it''s similar to feemarket module''s method,

        but makes the conversion to 18 decimals

        when the evm denom is represented with a different precision.'
      operationId: GlobalMinGasPrice
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.QueryGlobalMinGasPriceResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      tags:
      - Query
  /cosmos/evm/vm/v1/params:
    get:
      summary: Params queries the parameters of x/vm module.
      operationId: EvmParams
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.QueryParamsResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      tags:
      - Query
  /cosmos/evm/vm/v1/storage/{address}/{key}:
    get:
      summary: Storage queries the balance of all coins for a single account.
      operationId: Storage
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.QueryStorageResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      parameters:
      - name: address
        description: address is the ethereum hex address to query the storage state for.
        in: path
        required: true
        type: string
      - name: key
        description: key defines the key of the storage state
        in: path
        required: true
        type: string
      tags:
      - Query
  /cosmos/evm/vm/v1/trace_block:
    get:
      summary: 'TraceBlock implements the `debug_traceBlockByNumber` and

        `debug_traceBlockByHash` rpc api'
      operationId: TraceBlock
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.QueryTraceBlockResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      parameters:
      - name: trace_config.tracer
        description: tracer is a custom javascript tracer.
        in: query
        required: false
        type: string
      - name: trace_config.timeout
        description: 'timeout overrides the default timeout of 5 seconds for JavaScript-based

          tracing calls.'
        in: query
        required: false
        type: string
      - name: trace_config.reexec
        description: reexec defines the number of blocks the tracer is willing to go back.
        in: query
        required: false
        type: string
        format: uint64
      - name: trace_config.disable_stack
        description: disable_stack switches stack capture.
        in: query
        required: false
        type: boolean
      - name: trace_config.disable_storage
        description: disable_storage switches storage capture.
        in: query
        required: false
        type: boolean
      - name: trace_config.debug
        description: debug can be used to print output during capture end.
        in: query
        required: false
        type: boolean
      - name: trace_config.limit
        description: limit defines the maximum length of output, but zero means unlimited.
        in: query
        required: false
        type: integer
        format: int32
      - name: trace_config.overrides.homestead_block
        description: homestead_block switch (nil no fork, 0 = already homestead).
        in: query
        required: false
        type: string
      - name: trace_config.overrides.dao_fork_block
        description: dao_fork_block corresponds to TheDAO hard-fork switch block (nil no fork).
        in: query
        required: false
        type: string
      - name: trace_config.overrides.dao_fork_support
        description: 'dao_fork_support defines whether the nodes supports or opposes the DAO

          hard-fork.'
        in: query
        required: false
        type: boolean
      - name: trace_config.overrides.eip150_block
        description: 'eip150_block: EIP150 implements the Gas price changes

          (https://github.com/ethereum/EIPs/issues/150) EIP150 HF block (nil no fork).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.eip155_block
        description: 'eip155_block: EIP155Block HF block.'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.eip158_block
        description: 'eip158_block: EIP158 HF block.'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.byzantium_block
        description: 'byzantium_block: Byzantium switch block (nil no fork, 0 = already on

          byzantium).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.constantinople_block
        description: 'constantinople_block: Constantinople switch block (nil no fork, 0 = already

          activated).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.petersburg_block
        description: 'petersburg_block: Petersburg switch block (nil same as Constantinople).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.istanbul_block
        description: 'istanbul_block: Istanbul switch block (nil no fork, 0 = already on

          istanbul).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.muir_glacier_block
        description: 'muir_glacier_block: Eip-2384 (bomb delay) switch block (nil no fork, 0 =

          already activated).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.berlin_block
        description: 'berlin_block: Berlin switch block (nil = no fork, 0 = already on berlin).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.london_block
        description: 'london_block: London switch block (nil = no fork, 0 = already on london).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.arrow_glacier_block
        description: 'arrow_glacier_block: Eip-4345 (bomb delay) switch block (nil = no fork, 0 =

          already activated).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.gray_glacier_block
        description: 'gray_glacier_block: EIP-5133 (bomb delay) switch block (nil = no fork, 0 =

          already activated).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.merge_netsplit_block
        description: 'merge_netsplit_block: Virtual fork after The Merge to use as a network

          splitter.'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.chain_id
        description: chain_id is the id of the chain (EIP-155).
        in: query
        required: false
        type: string
        format: uint64
      - name: trace_config.overrides.denom
        description: denom is the denomination used on the EVM.
        in: query
        required: false
        type: string
      - name: trace_config.overrides.decimals
        description: decimals is the real decimal precision of the denomination used on the EVM.
        in: query
        required: false
        type: string
        format: uint64
      - name: trace_config.overrides.shanghai_time
        description: 'shanghai_time: Shanghai switch time (nil = no fork, 0 = already on

          shanghai).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.cancun_time
        description: 'cancun_time: Cancun switch time (nil = no fork, 0 = already on cancun).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.prague_time
        description: 'prague_time: Prague switch time (nil = no fork, 0 = already on prague).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.verkle_time
        description: 'verkle_time: Verkle switch time (nil = no fork, 0 = already on verkle).'
        in: query
        required: false
        type: string
      - name: trace_config.overrides.osaka_time
        description: 'osaka_time: Osaka switch time (nil = no fork, 0 = already on osaka).'
        in: query
        required: false
        type: string
      - name: trace_config.enable_memory
        description: enable_memory switches memory capture.
        in: query
        required: false
        type: boolean
      - name: trace_config.enable_return_data
        description: enable_return_data switches the capture of return data.
        in: query
        required: false
        type: boolean
      - name: trace_config.tracer_json_config
        description: tracer_json_config configures the tracer using a JSON string.
        in: query
        required: false
        type: string
      - name: block_number
        description: block_number of the traced block.
        in: query
        required: false
        type: string
        format: int64
      - name: block_hash
        description: block_hash (hex) of the traced block.
        in: query
        required: false
        type: string
      - name: block_time
        description: block_time of the traced block.
        in: query
        required: false
        type: string
        format: date-time
      - name: proposer_address
        description: proposer_address is the address of the requested block.
        in: query
        required: false
        type: string
        format: byte
      - name: chain_id
        description: chain_id is the eip155 chain id parsed from the requested block header.
        in: query
        required: false
        type: string
        format: int64
      - name: block_max_gas
        description: block_max_gas of the traced block.
        in: query
        required: false
        type: string
        format: int64
      tags:
      - Query
