  /cosmos/evm/vm/v1/trace_tx:
    get:
      summary: TraceTx implements the `debug_traceTransaction` rpc api
      operationId: TraceTx
      responses:
        '200':
          description: A successful response.
          schema:
            $ref: '#/definitions/cosmos.evm.vm.v1.QueryTraceTxResponse'
        default:
          description: An unexpected error response.
          schema:
            $ref: '#/definitions/grpc.gateway.runtime.Error'
      parameters:
      - name: msg.from
        description: 'from is the bytes of ethereum signer address. This address value is checked

          against the address derived from the signature (V, R, S) using the

          secp256k1 elliptic curve.'
        in: query
        required: false
        type: string
        format: byte
      - name: msg.raw
        description: raw is the raw ethereum transaction.
        in: query
        required: false
        type: string
        format: byte
      - name: trace_config.tracer
        description: tracer is a custom javascript tracer.
        in: query
        required: false
        type: string
      - name: trace_config.timeout
        description: 'timeout overrides the default timeout of 5 seconds for JavaScript-based

          tracing calls.'
        in: query
        required: false
