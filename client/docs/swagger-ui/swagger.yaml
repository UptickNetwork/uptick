definitions:
  cosmos.evm.vm.v1.AccessControl:
    type: object
    properties:
      create:
        $ref: '#/definitions/cosmos.evm.vm.v1.AccessControlType'
        title: create defines the permission policy for creating contracts
      call:
        $ref: '#/definitions/cosmos.evm.vm.v1.AccessControlType'
        title: call defines the permission policy for calling contracts
    title: 'AccessControl defines the permission policy of the EVM

      for creating and calling contracts'
  cosmos.evm.vm.v1.AccessControlType:
    type: object
    properties:
      access_type:
        $ref: '#/definitions/cosmos.evm.vm.v1.AccessType'
        title: access_type defines which type of permission is required for the operation
      access_control_list:
        type: array
        items:
          type: string
        title: 'access_control_list defines defines different things depending on the

          AccessType:

          - ACCESS_TYPE_PERMISSIONLESS: list of addresses that are blocked from

          performing the operation

          - ACCESS_TYPE_RESTRICTED: ignored

          - ACCESS_TYPE_PERMISSIONED: list of addresses that are allowed to perform

          the operation'
    title: AccessControlType defines the permission type for policies
  cosmos.evm.vm.v1.AccessType:
    type: string
    enum:
    - ACCESS_TYPE_PERMISSIONLESS
    - ACCESS_TYPE_RESTRICTED
    - ACCESS_TYPE_PERMISSIONED
    default: ACCESS_TYPE_PERMISSIONLESS
    description: "- ACCESS_TYPE_PERMISSIONLESS: ACCESS_TYPE_PERMISSIONLESS does not restrict the operation to anyone\n - ACCESS_TYPE_RESTRICTED:\
      \ ACCESS_TYPE_RESTRICTED restrict the operation to anyone\n - ACCESS_TYPE_PERMISSIONED: ACCESS_TYPE_PERMISSIONED only\
      \ allows the operation for specific addresses"
    title: AccessType defines the types of permissions for the operations
  cosmos.evm.vm.v1.ChainConfig:
    type: object
    properties:
      homestead_block:
        type: string
        title: homestead_block switch (nil no fork, 0 = already homestead)
      dao_fork_block:
        type: string
        title: dao_fork_block corresponds to TheDAO hard-fork switch block (nil no fork)
      dao_fork_support:
        type: boolean
        title: 'dao_fork_support defines whether the nodes supports or opposes the DAO

          hard-fork'
      eip150_block:
        type: string
        title: 'eip150_block: EIP150 implements the Gas price changes

          (https://github.com/ethereum/EIPs/issues/150) EIP150 HF block (nil no fork)'
      eip155_block:
        type: string
        title: 'eip155_block: EIP155Block HF block'
      eip158_block:
        type: string
        title: 'eip158_block: EIP158 HF block'
      byzantium_block:
        type: string
        title: 'byzantium_block: Byzantium switch block (nil no fork, 0 = already on

          byzantium)'
      constantinople_block:
        type: string
        title: 'constantinople_block: Constantinople switch block (nil no fork, 0 = already

          activated)'
      petersburg_block:
        type: string
        title: 'petersburg_block: Petersburg switch block (nil same as Constantinople)'
      istanbul_block:
        type: string
        title: 'istanbul_block: Istanbul switch block (nil no fork, 0 = already on

          istanbul)'
      muir_glacier_block:
        type: string
        title: 'muir_glacier_block: Eip-2384 (bomb delay) switch block (nil no fork, 0 =

          already activated)'
      berlin_block:
        type: string
        title: 'berlin_block: Berlin switch block (nil = no fork, 0 = already on berlin)'
      london_block:
        type: string
        title: 'london_block: London switch block (nil = no fork, 0 = already on london)'
      arrow_glacier_block:
        type: string
        title: 'arrow_glacier_block: Eip-4345 (bomb delay) switch block (nil = no fork, 0 =

          already activated)'
      gray_glacier_block:
        type: string
        title: 'gray_glacier_block: EIP-5133 (bomb delay) switch block (nil = no fork, 0 =

          already activated)'
      merge_netsplit_block:
        type: string
        title: 'merge_netsplit_block: Virtual fork after The Merge to use as a network

          splitter'
      chain_id:
        type: string
        format: uint64
        title: chain_id is the id of the chain (EIP-155)
      denom:
        type: string
        title: denom is the denomination used on the EVM
      decimals:
        type: string
        format: uint64
        title: decimals is the real decimal precision of the denomination used on the EVM
      shanghai_time:
        type: string
        title: 'shanghai_time: Shanghai switch time (nil = no fork, 0 = already on

          shanghai)'
      cancun_time:
        type: string
        title: 'cancun_time: Cancun switch time (nil = no fork, 0 = already on cancun)'
      prague_time:
        type: string
        title: 'prague_time: Prague switch time (nil = no fork, 0 = already on prague)'
      verkle_time:
        type: string
        title: 'verkle_time: Verkle switch time (nil = no fork, 0 = already on verkle)'
      osaka_time:
        type: string
        title: 'osaka_time: Osaka switch time (nil = no fork, 0 = already on osaka)'
    description: 'ChainConfig defines the Ethereum ChainConfig parameters using *sdk.Int values

      instead of *big.Int.'
  cosmos.evm.vm.v1.EstimateGasResponse:
    type: object
    properties:
      gas:
        type: string
        format: uint64
        title: gas returns the estimated gas
      ret:
        type: string
        format: byte
        title: 'ret is the returned data from evm function (result or data supplied with

          revert opcode)'
      vm_error:
        type: string
        title: vm_error is the error returned by vm execution
    title: EstimateGasResponse defines EstimateGas response
  cosmos.evm.vm.v1.ExtendedDenomOptions:
    type: object
    properties:
      extended_denom:
        type: string
  cosmos.evm.vm.v1.Log:
    type: object
    properties:
      address:
        type: string
        title: address of the contract that generated the event
      topics:
        type: array
        items:
          type: string
        description: topics is a list of topics provided by the contract.
      data:
        type: string
        format: byte
        title: data which is supplied by the contract, usually ABI-encoded
      block_number:
        type: string
        format: uint64
        title: block_number of the block in which the transaction was included
      tx_hash:
        type: string
        title: tx_hash is the transaction hash
      tx_index:
        type: string
        format: uint64
        title: tx_index of the transaction in the block
      block_hash:
        type: string
        title: block_hash of the block in which the transaction was included
      index:
        type: string
        format: uint64
        title: index of the log in the block
      removed:
        type: boolean
        description: 'removed is true if this log was reverted due to a chain

          reorganisation. You must pay attention to this field if you receive logs

          through a filter query.'
      block_timestamp:
        type: string
        format: uint64
        title: block_timestamp is the timestamp of the block in which the transaction was
    description: 'Log represents an protobuf compatible Ethereum Log that defines a contract

      log event. These events are generated by the LOG opcode and stored/indexed by

      the node.


      NOTE: address, topics and data are consensus fields. The rest of the fields

      are derived, i.e. filled in by the nodes, but not secured by consensus.'
  cosmos.evm.vm.v1.MsgEthereumTx:
    type: object
    properties:
      from:
        type: string
        format: byte
        title: 'from is the bytes of ethereum signer address. This address value is checked

          against the address derived from the signature (V, R, S) using the

          secp256k1 elliptic curve'
      raw:
        type: string
        format: byte
        title: raw is the raw ethereum transaction
    description: MsgEthereumTx encapsulates an Ethereum transaction as an SDK message.
  cosmos.evm.vm.v1.MsgEthereumTxResponse:
    type: object
    properties:
      hash:
        type: string
        title: 'hash of the ethereum transaction in hex format. This hash differs from the

          CometBFT sha256 hash of the transaction bytes. See

          https://github.com/tendermint/tendermint/issues/6539 for reference'
      logs:
        type: array
        items:
          $ref: '#/definitions/cosmos.evm.vm.v1.Log'
        description: 'logs contains the transaction hash and the proto-compatible ethereum

          logs.'
      ret:
        type: string
        format: byte
        title: 'ret is the returned data from evm function (result or data supplied with

          revert opcode)'
      vm_error:
        type: string
        title: vm_error is the error returned by vm execution
      gas_used:
        type: string
        format: uint64
        title: gas_used specifies how much gas was consumed by the transaction
      max_used_gas:
        type: string
        format: uint64
        title: max_used_gas specifies the gas consumed by the transaction, not including refunds
      block_hash:
        type: string
        format: byte
        title: include the block hash for json-rpc to use
      block_timestamp:
        type: string
        format: uint64
        title: include the block timestamp for json-rpc to use
    description: MsgEthereumTxResponse defines the Msg/EthereumTx response type.
  cosmos.evm.vm.v1.Params:
    type: object
    properties:
      evm_denom:
        type: string
        description: 'evm_denom represents the token denomination used to run the EVM state

          transitions.'
      extra_eips:
        type: array
        items:
          type: string
          format: int64
        title: extra_eips defines the additional EIPs for the vm.Config
      evm_channels:
        type: array
        items:
          type: string
        title: evm_channels is the list of channel identifiers from EVM compatible chains
      access_control:
        $ref: '#/definitions/cosmos.evm.vm.v1.AccessControl'
        title: access_control defines the permission policy of the EVM
      active_static_precompiles:
        type: array
        items:
          type: string
        title: 'active_static_precompiles defines the slice of hex addresses of the

          precompiled contracts that are active'
      history_serve_window:
        type: string
        format: uint64
      extended_denom_options:
        $ref: '#/definitions/cosmos.evm.vm.v1.ExtendedDenomOptions'
    title: Params defines the EVM module parameters
  cosmos.evm.vm.v1.QueryAccountResponse:
    type: object
    properties:
      balance:
        type: string
        description: balance is the balance of the EVM denomination.
      code_hash:
        type: string
        description: code_hash is the hex-formatted code bytes from the EOA.
      nonce:
        type: string
        format: uint64
        description: nonce is the account's sequence number.
    description: QueryAccountResponse is the response type for the Query/Account RPC method.
  cosmos.evm.vm.v1.QueryBalanceResponse:
    type: object
    properties:
      balance:
        type: string
        description: balance is the balance of the EVM denomination.
    description: QueryBalanceResponse is the response type for the Query/Balance RPC method.
  cosmos.evm.vm.v1.QueryBaseFeeResponse:
    type: object
    properties:
      base_fee:
        type: string
        title: base_fee is the EIP1559 base fee
    description: QueryBaseFeeResponse returns the EIP1559 base fee.
  cosmos.evm.vm.v1.QueryCodeResponse:
    type: object
    properties:
      code:
        type: string
        format: byte
        description: code represents the code bytes from an ethereum address.
    description: 'QueryCodeResponse is the response type for the Query/Code RPC

      method.'
  cosmos.evm.vm.v1.QueryConfigResponse:
    type: object
    properties:
      config:
        $ref: '#/definitions/cosmos.evm.vm.v1.ChainConfig'
        title: config is the evm configuration
    description: QueryConfigResponse returns the EVM config.
  cosmos.evm.vm.v1.QueryCosmosAccountResponse:
    type: object
    properties:
      cosmos_address:
        type: string
        description: cosmos_address is the cosmos address of the account.
      sequence:
        type: string
        format: uint64
        description: sequence is the account's sequence number.
      account_number:
        type: string
        format: uint64
        title: account_number is the account number
    description: 'QueryCosmosAccountResponse is the response type for the Query/CosmosAccount

      RPC method.'
  cosmos.evm.vm.v1.QueryGlobalMinGasPriceResponse:
    type: object
    properties:
      min_gas_price:
        type: string
        title: min_gas_price is the feemarket's min_gas_price
    title: QueryGlobalMinGasPriceResponse returns the GlobalMinGasPrice
  cosmos.evm.vm.v1.QueryParamsResponse:
    type: object
    properties:
      params:
        $ref: '#/definitions/cosmos.evm.vm.v1.Params'
        description: params define the evm module parameters.
    description: QueryParamsResponse defines the response type for querying x/vm parameters.
  cosmos.evm.vm.v1.QueryStorageResponse:
    type: object
    properties:
      value:
        type: string
        description: value defines the storage state value hash associated with the given key.
    description: 'QueryStorageResponse is the response type for the Query/Storage RPC

      method.'
  cosmos.evm.vm.v1.QueryTraceBlockResponse:
    type: object
    properties:
      data:
        type: string
        format: byte
        title: data is the response serialized in bytes
    title: QueryTraceBlockResponse defines TraceBlock response
  cosmos.evm.vm.v1.QueryTraceCallResponse:
    type: object
    properties:
      data:
        type: string
        format: byte
        title: data is the response serialized in bytes
    title: QueryTraceCallResponse defines TraceCall response
  cosmos.evm.vm.v1.QueryTraceTxResponse:
    type: object
    properties:
      data:
        type: string
        format: byte
        title: data is the response serialized in bytes
    title: QueryTraceTxResponse defines TraceTx response
  cosmos.evm.vm.v1.QueryValidatorAccountResponse:
    type: object
    properties:
      account_address:
        type: string
        description: account_address is the cosmos address of the account in bech32 format.
