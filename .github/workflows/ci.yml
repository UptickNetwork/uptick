name: ci

on:
  pull_request:
  push:
    branches:
      - release/**
      # uge/* is the active UGE V1 development line; without it pushes there
      # ran no CI at all (ci-additions-plan.md, batch one).
      - uge/**

# Audit O-05: every third-party action below is pinned to an immutable commit
# SHA (with the human-readable release in a trailing comment) instead of a
# mutable tag: a tag can be re-pointed by whoever controls the upstream repo,
# turning a normal run into arbitrary code execution with access to the repo
# token. To update one, resolve the new tag, review the old->new diff, then
# replace the SHA and the comment together.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: "go.mod"

      - name: Build
        run: make build

      # `make test` is `go test -race ./...`, so this covers the unit suites AND
      # the real-EVM ERC721 suite in app/erc721_contract_evm_test.go (audit
      # G-07/G-08/O-04), which deploys the embedded bytecode on a live EVM keeper
      # -- the only way to prove _safeMint honours receiver hooks, that a
      # revert/gas-burn rolls the mint back, and that _burn clears the enhance
      # metadata.
      - name: Test
        run: make test

  # T-G7 / audit gap: the committed Swagger bundle (client/docs/statik/statik.go)
  # is generated from client/docs/swagger-ui by rakyll/statik, but nothing in CI
  # regenerated it, so a source change could land without its bundle and the REST
  # gateway would serve the stale spec.
  #
  # `make update-swagger-docs` regenerates the bundle and then fails on a
  # non-empty `git status` (its check used to be a no-op -- `$(git status
  # --porcelain)` was an undefined Make variable -- and is now a real shell
  # substitution). In a fresh checkout the generator can only touch the bundle, so
  # a non-empty diff is proof of drift; the target never "fixes and passes".
  swagger-docs-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: "go.mod"

      - name: Verify swagger docs are in sync
        run: make update-swagger-docs

  # FIELD18 lesson: v0.5.1-t1 shipped with the Params case present in the Go
  # code but missing from the registered FileDescriptor -- CheckTx
  # RejectUnknownFieldsStrict rejected every legal Params message, and the gap
  # was found by hand. Nothing in CI compared committed generated code against
  # what the pinned toolchain produces (ci-additions-plan.md A1; the evmos /
  # osmosis repos both run this gate). Regenerate with the repo's pinned
  # protobuf toolchain and fail on any diff: the committed *.pb.go must be
  # exactly what the committed *.proto files produce.
  proto-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Regenerate protobuf artifacts
        run: make proto-gen

      # TEMP DIAGNOSTIC for proto-consistency red on GH runners while the same
      # image+script+content succeeds in a local clone: print the toolchain and
      # loop state. Remove once the root cause is fixed.
      - name: Diagnose proto generation (temp)
        if: always()
        run: |
          echo "=== toolchain ==="
          docker --version
          docker run --rm ghcr.io/cosmos/proto-builder:0.14.0 buf --version
          echo "=== repo shape ==="
          ls proto/ | head -8
          find proto/uptick -name '*.proto' | wc -l
          grep -l "option go_package" $(find proto/uptick -name '*.proto') 2>/dev/null | wc -l
          echo "=== loop dry run ==="
          cd proto
          proto_dirs=$(find ./uptick -path -prune -o -name '*.proto' -print0 | xargs -0 -n1 dirname | sort | uniq)
          echo "proto_dirs: $(echo "$proto_dirs" | wc -l)"
          echo "$proto_dirs" | head -8
          echo "=== single-file buf INSIDE container (clean mount) ==="
          REPO_ROOT="$(pwd -P)"
          docker run --rm -v "${REPO_ROOT}:/ws" --workdir /ws --entrypoint sh \
            -e BUF_LOG_LEVEL=debug \
            ghcr.io/cosmos/proto-builder:0.14.0 -c '
              echo "=== /ws as seen by container ==="
              ls /ws | head -8
              cd /ws/proto || exit 9
              echo "cwd=$(pwd)"
              buf generate --template buf.gen.gogo.yaml ./uptick/appmining/v1/tx.proto
              echo "buf rc=$?"
              echo "=== where did tx.pb.go land? (whole container fs) ==="
              find / -name "tx.pb.go" -mmin -3 -not -path "/proc/*" 2>/dev/null | head -8
              echo "=== debug tail ==="
            ' 2>&1 | tail -40

      - name: Inspect scratch after proto-gen (temp)
        if: always()
        run: |
          ls -d github.com 2>/dev/null && du -sh github.com || echo "no github.com scratch on host"
          git status --porcelain | head -20

      # Scoped to the generated-code patterns (not `git status` at large):
      # protocgen.sh also rewrites docs/proto & docs/api proto-docs.md, and any
      # other dirty file would be a pre-existing condition of the runner, not
      # this job's signal.
      - name: Fail on generated-code drift
        run: |
          drift="$(git status --porcelain -- '*.pb.go' '*.pb.gw.go')"
          if [[ -n "$drift" ]]; then
            echo "::error::protobuf generated code is out of sync with the .proto sources."
            echo "::error::Run 'make proto-gen' locally and commit the regenerated files."
            echo "$drift"
            exit 1
          fi

  # scripts/check-appmining-contract.sh has an executable twin
  # (x/appmining/contract_guard_test.go) that runs under `make test`, but a Go
  # test alone does not protect the shell-side whole-repo literal scans
  # (ci-additions-plan.md A2). Run the script itself: it is pure bash, no Go
  # toolchain needed, and it is the UGE V1 contract gate on the active branch.
  appmining-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: UGE appmining contract guard
        run: bash scripts/check-appmining-contract.sh

  # Denom format guard: the Go pin tests (app/denom_format_pin_test.go) only
  # pin specific denom shapes; the shell scan is the only place the whole repo
  # is swept for the legacy "erc20/" literal, hardcoded "erc20:" and *denom*
  # case folding (ci-workflow-review.md §4).
  denom-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Denom format guard
        run: bash scripts/check-denom-format.sh
