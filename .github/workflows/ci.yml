name: ci

on:
  pull_request:
  push:
    branches:
      - development
      - release/v0.4.0
      - release/**

# Audit O-05: every third-party action below is pinned to an immutable commit
# SHA (with the human-readable release in a trailing comment) instead of a
# mutable tag: a tag can be re-pointed by whoever controls the upstream repo,
# turning a normal run into arbitrary code execution with access to the repo
# token. To update one, resolve the new tag, review the old->new diff, then
# replace the SHA and the comment together.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.13"

      - name: Build
        run: make build

      # `make test` is `go test -race ./...`, so this covers the unit suites AND
      # the real-EVM ERC721 suite in app/erc721_contract_evm_test.go (audit
      # G-07/G-08/O-04), which deploys the embedded bytecode on a live EVM keeper
      # -- the only way to prove _safeMint honours receiver hooks, that a
      # revert/gas-burn rolls the mint back, and that _burn clears the enhance
      # metadata.
      - name: Test
        run: make test

  # Audit G-06 (part 1): determinism, export/import and resume-from-export were
  # only ever run by hand, yet each is a release blocker (an export/import
  # asymmetry corrupts state on upgrade; a nondeterministic app forks the chain).
  # They run here with CI-sized block counts. `-Enabled=true` is mandatory --
  # simulation tests skip themselves without it, which is how a "green" job
  # proves nothing.
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.13"

      - name: Short-seed simulation gate
        run: make test-sim-ci

  # Audit G-06 (part 2): the unit suite cannot reach the REST gateway or the EVM
  # JSON-RPC endpoint. This job boots a real node (scripts/e2e-localnet.sh), then
  # runs tests/e2e with UPTICK_E2E_STRICT=1 so an unreachable node FAILS instead
  # of skipping -- a suite that skips itself never proved a Keplr broadcast
  # worked.
  e2e-localnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.13"

      - name: Build uptickd
        run: make build

      # Node lifecycle, test run and teardown happen inside a single `make`
      # invocation (one shell): a background node started in an earlier step is
      # not guaranteed to outlive it.
      - name: Run the e2e suite against a real node
        env:
          UPTICKD: ${{ github.workspace }}/build/uptickd
          UPTICK_E2E_HOME: ${{ runner.temp }}/uptick-e2e
        run: make test-e2e-localnet

      - name: Show node log on failure
        if: failure()
        run: tail -n 200 "${{ runner.temp }}/uptick-e2e/e2e-localnet.log" || true

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.13"

      - name: Lint
        # v6 does not support golangci-lint v2 ("invalid version string
        # 'v2.13.2'"); v7 is required for the v2 binary + v2 config schema.
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.13.2

      # The action above is the pinned installer; this step is the contract.
      # Keeping BOTH is deliberate: the action owns "pin the version and put the
      # binary on PATH", while `make lint` owns "the exact command a developer
      # runs". They must stay separate because the failure guarded against is a
      # Makefile target that rots while the action keeps the job green --
      # golangci-lint v2 removed `--out-format`, `make lint` began dying on every
      # invocation, and nobody noticed because CI had switched to the action
      # directly. Do not delete either step -- deleting this one re-opens that
      # hole.
      - name: Lint via the Makefile target
        run: |
          command -v golangci-lint || { echo "::error::golangci-lint not on PATH"; exit 1; }
          make lint

  # T-G7 / audit gap: the committed Swagger bundle (client/docs/statik/statik.go)
  # is generated from client/docs/swagger-ui by rakyll/statik, but nothing in CI
  # regenerated it, so a source change could land without its bundle and the REST
  # gateway would serve the stale spec.
  #
  # `make update-swagger-docs` regenerates the bundle and then fails on a
  # non-empty `git status` (its check used to be a no-op -- `$(git status
  # --porcelain)` was an undefined Make variable -- and is now a real shell
  # substitution). In a fresh checkout the generator can only touch the bundle, so
  # a non-empty diff is proof of drift; the target never "fixes and passes".
  swagger-docs-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.13"

      - name: Verify swagger docs are in sync
        run: make update-swagger-docs

  contracts-reproducible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install pinned solc
        run: |
          # Audit follow-up: verify the downloaded binary against the official
          # v0.8.28 release asset so a supply-chain swap of the compiler cannot
          # silently change contract bytecode.
          curl -fsSL https://github.com/ethereum/solidity/releases/download/v0.8.28/solc-static-linux \
            -o /usr/local/bin/solc
          echo "9a0fb7e0db2c0641dbae1c5cc645dc686820c83af516226abb1c0a2f76636f25  /usr/local/bin/solc" | sha256sum -c -
          chmod +x /usr/local/bin/solc
          solc --version

      - name: Verify reproducible contract bytecode
        working-directory: contracts
        run: make verify-contracts-reproducible

      # The ERC721 receiver fixtures the EVM suite deploys are compiled into
      # app/erc721_evm_receivers_gen_test.go. Without this check a change to
      # contracts/test/EVMReceiverFixtures.sol would leave the tests running the
      # OLD bytecode -- passing while testing other than the committed Solidity.
      - name: Verify generated receiver fixtures are current
        working-directory: contracts/test
        run: ./gen_receivers.py --check

      # R-NEW-3: integrity of the committed artifacts (checksums.txt) plus the
      # embedded x/erc721 copy must never drift from the canonical root JSON.
      - name: Verify committed artifacts and embedded copy
        working-directory: contracts
        run: make verify-contracts

  # `app/upgrades/v040/` is a frozen tree: the v0.4.0 handler plus its legacy
  # registry shims, which run once on live state during a chain halt. The freeze
  # was once prose in .golangci.yml (nothing could go red), so a `style(lint)`
  # commit rewriting a frozen file landed unnoticed. This job is the mechanical
  # gate (scripts/check-v040-frozen.sh), in two parts:
  #
  #   A. A CONTENT pin: the blob shas of every TRACKED file under
  #      app/upgrades/v040/, read from the WORKING TREE, are compared as a set to
  #      scripts/v040-frozen.sha256, so an uncommitted edit is caught. History and
  #      merge semantics are not consulted, so the merges part B ignores cannot
  #      hide anything from A either -- with ONE recorded exception: a merge that
  #      edits a frozen file and the manifest TOGETHER is invisible to both
  #      (RESIDUAL (1a)). Needs no fetch depth.
  #
  #   B. A LABEL check: of the non-merge commits that modified the pin, the
  #      FRONTIER (those not superseded by a later pin write) must all have a
  #      `fix(v040):` subject; the only exempt case is the pin BIRTH WINDOW
  #      (RESIDUAL (1b)). Requiring EVERY in-range pin write is red-forever once a
  #      bad commit lands (how a gate gets bypassed with `|| true`); a later
  #      `fix(v040):` re-pin is the sanctioned remedy. It is NOT `git log -1 --
  #      <path>` (committer date, not topology). `fetch-depth: 0` is mandatory --
  #      the shallow default hides the base and the gate exits non-zero, never 0,
  #      when it cannot resolve it. A branch-creating push whose `before` is the
  #      all-zero sha falls back to the built-in anchor, and there is no
  #      `git ... || true`: a git failure is fatal, never "nothing to check".
  v040-frozen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Pure git; no Go toolchain needed. The PR base comes from the event; the
      # push "before" covers pushes to release/** (an all-zero value means a new
      # branch and is ignored in favour of the built-in anchor).
      - name: Verify app/upgrades/v040 is frozen
        env:
          V040_PR_BASE: ${{ github.event.pull_request.base.sha }}
          V040_PUSH_BEFORE: ${{ github.event.before }}
        run: make check-v040-frozen

  # CONTRIBUTING.md tells contributors to run `make <target>` commands, so it is
  # a contract. It claimed `development` must never fail `make test-import`, but
  # no `test-import` rule has ever existed in the Makefile (only a stale `.PHONY`
  # mention) -- running it fails with "No rule to make target". This job fails
  # whenever the doc advertises a target the Makefile does not define; it reads
  # both inline spans and fenced code blocks (where the CI commands live, e.g.
  # `UPTICK_E2E_STRICT=1 make test-e2e-localnet`), never bare prose verbs.
  contributing-targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify documented make targets exist
        run: make check-doc-make-targets
