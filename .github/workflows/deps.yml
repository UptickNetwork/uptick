name: dependency-security

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Audit P2-8: keep this aligned with go.mod (go 1.25.13). govulncheck
      # compiled with an older toolchain fails in source mode.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

      # Audit P2-8 policy decision: this job intentionally has NO
      # continue-on-error. A confirmed vulnerability in the symbol graph must
      # turn the weekly check red — silence is how P1-2/P2-9-style "declared
      # protection that does nothing" bugs survive. If a finding cannot be
      # fixed immediately, track it in an issue and reference the issue here
      # rather than muting the job.
